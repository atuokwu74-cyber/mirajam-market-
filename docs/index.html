<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIRAJAM Market - Owner</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .order {
      background: white;
      margin-bottom: 15px;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .order h3 {
      margin-top: 0;
    }

    .label {
      font-weight: bold;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #111;
      color: white;
      margin-bottom: 15px;
    }

    .error {
      color: red;
      background: #ffeaea;
      padding: 10px;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<header>
  <h1>MIRAJAM Market — Owner Dashboard</h1>
</header>

<div class="container">

  <button onclick="loadOrders()">Refresh Orders</button>

  <div id="message"></div>
  <div id="orders"></div>

</div>

<script>

const SUPABASE_URL = "https://zqvvtsvzlpcupasdyiju.supabase.co";

const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loadOrders() {

  const ordersBox = document.getElementById("orders");
  const message = document.getElementById("message");

  ordersBox.innerHTML = "Loading orders...";
  message.innerHTML = "";

  const { data, error } = await supabaseClient
    .from("orders")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    ordersBox.innerHTML = "";
    message.innerHTML =
      `<div class="error">Error: ${error.message}</div>`;
    return;
  }

  if (!data || data.length === 0) {
    ordersBox.innerHTML = "<p>No orders yet.</p>";
    return;
  }

  ordersBox.innerHTML = "";

  data.forEach(order => {

    let items = "";

    try {
      items = typeof order.items === "string"
        ? JSON.parse(order.items)
        : order.items;
    } catch {
      items = order.items;
    }

    if (typeof items === "object") {
      items = JSON.stringify(items, null, 2);
    }

    ordersBox.innerHTML += `
      <div class="order">

        <h3>Order #${order.id}</h3>

        <p>
          <span class="label">Customer:</span>
          ${order.customer_name || ""}
        </p>

        <p>
          <span class="label">Phone:</span>
          ${order.phone || ""}
        </p>

        <p>
          <span class="label">Delivery Address:</span>
          ${order.address || ""}
        </p>

        <p>
          <span class="label">Items:</span><br>
          ${items || ""}
        </p>

        <p>
          <span class="label">Total:</span>
          ₦${Number(order.total || 0).toLocaleString()}
        </p>

        <p>
          <span class="label">Status:</span>
          ${order.status || "Pending"}
        </p>

      </div>
    `;
  });
}

loadOrders();

</script>

</body>
</html>
