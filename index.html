<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRAJAM Market</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
  padding-bottom:80px;
}
header{
  background:#087f23;
  color:white;
  padding:20px 15px;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{font-size:25px}
header p{margin-top:5px;font-size:14px}

.search{
  margin-top:15px;
  display:flex;
  background:white;
  border-radius:10px;
  overflow:hidden;
}
.search input{
  flex:1;
  padding:14px;
  border:0;
  outline:0;
  font-size:15px;
}
.search button{
  border:0;
  background:#ffb000;
  padding:0 18px;
  font-size:18px;
}

.container{padding:15px}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:18px;
}
.categories button{
  white-space:nowrap;
  border:1px solid #087f23;
  background:white;
  color:#087f23;
  padding:9px 13px;
  border-radius:20px;
}
.categories button.active{
  background:#087f23;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:white;
  border-radius:12px;
  padding:10px;
  box-shadow:0 2px 8px #00000012;
}
.card .pic{
  height:110px;
  background:#eee;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
}
.card h3{
  font-size:16px;
  margin-top:10px;
}
.unit{
  color:#777;
  font-size:13px;
  margin:5px 0;
}
.price{
  font-weight:bold;
  color:#087f23;
  margin:7px 0;
}
.card button{
  width:100%;
  border:0;
  background:#087f23;
  color:white;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
}

.section{display:none}
.section.active{display:block}

.basket-item{
  background:white;
  padding:14px;
  margin-bottom:10px;
  border-radius:10px;
}
.qty{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:10px;
}
.qty button{
  width:32px;
  height:32px;
  border:0;
  border-radius:6px;
  background:#087f23;
  color:white;
  font-size:18px;
}
.remove{
  margin-left:auto;
  border:0;
  background:#d62828;
  color:white;
  padding:7px 10px;
  border-radius:6px;
}

.form{
  background:white;
  padding:15px;
  border-radius:12px;
}
.form input,.form textarea{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:8px;
}
.form button{
  width:100%;
  padding:13px;
  background:#087f23;
  color:white;
  border:0;
  border-radius:8px;
  font-weight:bold;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px 5px;
  box-shadow:0 -2px 10px #0002;
  z-index:20;
}
.bottom button{
  border:0;
  background:none;
  font-size:12px;
  color:#555;
}
.bottom span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.empty{
  text-align:center;
  padding:40px 15px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <h1>🛒 MIRAJAM Market</h1>
  <p>The physical market in a digital world.</p>

  <div class="search">
    <input id="searchInput" type="text"
      placeholder="Search for anything in the market..."
      oninput="searchProducts()">
    <button onclick="searchProducts()">🔍</button>
  </div>
</header>

<div class="container">

  <!-- HOME -->
  <section id="home" class="section active">
    <h2 style="margin-bottom:12px;">Shop the Market</h2>

    <div class="categories">
      <button class="active" onclick="filterCategory('All',this)">All</button>
      <button onclick="filterCategory('Fresh Food',this)">Fresh Food</button>
      <button onclick="filterCategory('Meat',this)">Meat</button>
      <button onclick="filterCategory('Fish',this)">Fish</button>
      <button onclick="filterCategory('Grains',this)">Grains</button>
      <button onclick="filterCategory('Fruits',this)">Fruits</button>
      <button onclick="filterCategory('Household',this)">Household</button>
    </div>

    <div id="products" class="products"></div>
  </section>

  <!-- BASKET -->
  <section id="basket" class="section">
    <h2>🛒 My Basket</h2>
    <br>
    <div id="basketItems"></div>
    <button onclick="showCheckout()" style="
      width:100%;padding:14px;background:#087f23;color:white;
      border:0;border-radius:8px;font-weight:bold;">
      Proceed to Checkout
    </button>
  </section>

  <!-- CHECKOUT -->
  <section id="checkout" class="section">
    <h2>Checkout</h2>
    <br>

    <div class="form">
      <input id="name" placeholder="Full name">
      <input id="phone" placeholder="Phone number">
      <textarea id="address" rows="3"
        placeholder="Delivery address"></textarea>
