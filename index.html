<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRAJAM Market</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
  padding-bottom:75px;
}

header{
  background:#087f23;
  color:white;
  padding:20px 15px;
}

header h1{margin:0;font-size:26px}
header p{margin:6px 0 15px;font-size:14px}

.search{
  display:flex;
  background:white;
  border-radius:10px;
  overflow:hidden;
}

.search input{
  flex:1;
  padding:14px;
  border:0;
  outline:0;
  font-size:15px;
}

.search button{
  border:0;
  background:#ffb000;
  padding:0 18px;
  font-size:18px;
}

.container{padding:15px}

.section{display:none}
.section.active{display:block}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin:15px 0;
}

.categories button{
  white-space:nowrap;
  padding:9px 14px;
  border:1px solid #087f23;
  border-radius:20px;
  background:white;
  color:#087f23;
}

.categories button.active{
  background:#087f23;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:white;
  padding:10px;
  border-radius:12px;
  box-shadow:0 2px 8px #0002;
}

.pic{
  height:110px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee;
  border-radius:9px;
  font-size:48px;
}

.card h3{
  margin:10px 0 5px;
  font-size:16px;
}

.unit{
  color:#777;
  font-size:13px;
}

.price{
  color:#087f23;
  font-weight:bold;
  margin:8px 0;
}

.card button,
.checkout-btn{
  width:100%;
  padding:11px;
  border:0;
  border-radius:8px;
  background:#087f23;
  color:white;
  font-weight:bold;
}

.card button:active,
.checkout-btn:active,
.bottom button:active{
  transform:scale(.96);
}

.basket-item{
  background:white;
  padding:14px;
  margin-bottom:10px;
  border-radius:10px;
}

.qty{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:10px;
}

.qty button{
  width:34px;
  height:34px;
  border:0;
  border-radius:6px;
  background:#087f23;
  color:white;
  font-size:18px;
}

.remove{
  margin-left:auto;
  background:#d62828!important;
  width:auto!important;
  padding:7px 10px!important;
  font-size:12px!important;
}

.form{
  background:white;
  padding:15px;
  border-radius:12px;
}

.form input,
.form textarea{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:14px;
}

.empty{
  text-align:center;
  padding:40px 10px;
  color:#777;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -2px 10px #0002;
  z-index:100;
}

.bottom button{
  border:0;
  background:none;
  color:#555;
  font-size:12px;
}

.bottom span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.notice{
  background:#fff3cd;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  font-size:13px;
}
</style>
</head>

<body>

<header>

<h1>🛒 MIRAJAM Market</h1>

<p>The physical market in a digital world.</p>

<div class="search">

<input
id="searchInput"
type="text"
placeholder="Search for anything..."
oninput="searchProducts()">

<button onclick="searchProducts()">🔍</button>

</div>

</header>


<div class="container">


<!-- HOME -->

<section id="home" class="section active">

<div class="notice">
🛍️ Tell us what you need. MIRAJAM goes to the physical market, buys it, checks it and arranges delivery.
</div>

<h2>Shop the Market</h2>

<div class="categories">

<button class="active" onclick="filterCategory('All',this)">
All
</button>

<button onclick="filterCategory('Fresh Food',this)">
Fresh Food
</button>

<button onclick="filterCategory('Meat',this)">
Meat
</button>

<button onclick="filterCategory('Fish',this)">
Fish
</button>

<button onclick="filterCategory('Grains',this)">
Grains
</button>

<button onclick="filterCategory('Fruits',this)">
Fruits
</button>

<button onclick="filterCategory('Household',this)">
Household
</button>

</div>

<div id="products" class="products"></div>

</section>


<!-- BASKET -->

<section id="basket" class="section">

<h2>🛒 My Basket</h2>

<br>

<div id="basketItems"></div>

<button class="checkout-btn" onclick="showCheckout()">
Proceed to Checkout
</button>

</section>


<!-- CHECKOUT -->

<section id="checkout" class="section">

<h2>Checkout</h2>

<br>

<div class="form">

<input id="name" placeholder="Full name">

<input id="phone" placeholder="Phone number">

<textarea
id="address"
rows="3"
placeholder="Delivery address"></textarea>

<textarea
id="notes"
rows="3"
placeholder
</script>

</body>
</html>
